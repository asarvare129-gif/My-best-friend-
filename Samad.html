<!DOCTYPE html>
<html>
<head>
    <title>Best Friend</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #000000, #0f2027, #203a43);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #00f2ff;
            font-size: 50px;
            text-align: center;
            text-shadow: 0 0 10px #00f2ff,
                         0 0 20px #00f2ff,
                         0 0 40px #00f2ff;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #00f2ff;
            }
            to {
                text-shadow: 0 0 30px #00f2ff,
                             0 0 60px #00f2ff;
            }
        }
    </style>
</head>
<body>

    <h1>My Best Friend Forever<br>Samad Warsi</h1>

</body>
</html>
